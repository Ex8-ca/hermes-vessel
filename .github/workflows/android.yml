name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach the APK to tagged releases
      id-token: write      # build attestation
      attestations: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper jar is committed (it is a compiled archive); install Gradle instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      # The runner's preinstalled sdkmanager is the wrong version and hangs on an
      # interactive license prompt. Install pinned cmdline-tools, verify, accept non-interactively.
      - name: Install Android SDK
        env:
          CMDLINE_TOOLS: 11076708
          CMDLINE_SHA256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS}_latest.zip"
          echo "${CMDLINE_SHA256}  /tmp/cmdline-tools.zip" | sha256sum -c -
          mkdir -p "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest" /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Provide SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build
        run: gradle :app:assembleDebug --no-daemon

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/hermes-vessel.apk"
          sha256sum "$GITHUB_WORKSPACE/hermes-vessel.apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-vessel-apk
          path: hermes-vessel.apk

      # Attestations need a public repository (or GitHub Enterprise Cloud).
      - name: Attest build provenance
        if: ${{ !github.event.repository.private && github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: hermes-vessel.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Hermes Vessel $GITHUB_REF_NAME" --generate-notes \
            "$GITHUB_WORKSPACE/hermes-vessel.apk" \
            || gh release upload "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE/hermes-vessel.apk" --clobber
