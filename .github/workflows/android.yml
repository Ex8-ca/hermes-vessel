name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach the APK to tagged releases
      id-token: write      # build attestation
      attestations: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper jar is committed (it is a compiled archive); install Gradle instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.1'

      # The runner's preinstalled sdkmanager is the wrong version and hangs on an
      # interactive license prompt. Install pinned cmdline-tools, verify, accept non-interactively.
      - name: Install Android SDK
        env:
          CMDLINE_TOOLS: 11076708
          CMDLINE_SHA256: 2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258
        run: |
          set -euo pipefail
          SDK_ROOT="$ANDROID_SDK_ROOT"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS}_latest.zip"
          echo "${CMDLINE_SHA256}  /tmp/cmdline-tools.zip" | sha256sum -c -
          mkdir -p "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest" /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Provide SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # Tags (v0.1.0, v0.2.0-rc1, ...) build a signed release; everything else a debug APK.
      - name: Decide build type
        id: kind
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Load release key
        if: steps.kind.outputs.release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.VESSEL_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The VESSEL_KEYSTORE_B64 secret is missing; refusing to publish a release without the release key."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VESSEL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          VESSEL_KEYSTORE_PASSWORD: ${{ secrets.VESSEL_KEYSTORE_PASSWORD }}
          VESSEL_KEY_ALIAS: ${{ secrets.VESSEL_KEY_ALIAS }}
          VESSEL_KEY_PASSWORD: ${{ secrets.VESSEL_KEY_PASSWORD }}
          VERSION: ${{ steps.kind.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ steps.kind.outputs.release }}" = "true" ]; then
            gradle :app:assembleRelease --no-daemon -PvesselVersionName="$VERSION" -PvesselVersionCode="$GITHUB_RUN_NUMBER"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/hermes-vessel.apk"
          else
            gradle :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/hermes-vessel.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Checksum
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sha256sum hermes-vessel.apk | tee hermes-vessel.apk.sha256
          { echo "### hermes-vessel.apk (${{ steps.kind.outputs.version }})"; echo '```'; cat hermes-vessel.apk.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-vessel-${{ steps.kind.outputs.version }}
          path: |
            hermes-vessel.apk
            hermes-vessel.apk.sha256

      # Attestations need a public repository (or GitHub Enterprise Cloud).
      - name: Attest build provenance
        if: ${{ !github.event.repository.private && github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: hermes-vessel.apk

      - name: Publish release
        if: steps.kind.outputs.release == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Install on your phone

          1. On your Android phone (Android 8 or newer), tap **hermes-vessel.apk** below to download it.
          2. Open it. If Android asks, allow installs from your browser, then tap **Install**.
          3. On the computer running Hermes, run \`hermes vessel pair\`, scan the QR code with the phone and tap **Pair this phone**.

          The app is signed with the Hermes Vessel release key (\`CN=Hermes Vessel, O=Ex8-ca, C=CA\`), so later versions install over this one.

          ## Verify this build

          \`\`\`
          sha256sum -c hermes-vessel.apk.sha256
          gh attestation verify hermes-vessel.apk --repo ${GITHUB_REPOSITORY}
          \`\`\`
          EOF
          PRE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" $PRE --title "Hermes Vessel $GITHUB_REF_NAME" --notes-file notes.md \
            hermes-vessel.apk hermes-vessel.apk.sha256 \
            || gh release upload "$GITHUB_REF_NAME" hermes-vessel.apk hermes-vessel.apk.sha256 --clobber
